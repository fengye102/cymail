server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  location = /public/pickup { proxy_pass http://api:8081/public/pickup; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location ^~ /api/ { return 404; }
  location ^~ /public/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
